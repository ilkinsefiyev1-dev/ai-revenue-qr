<!DOCTYPE html>
<html lang="az">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AI Bistro - Kitchen</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 20px;
    background: #020617;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

.connection {
    font-size: 13px;
    color: #86efac;
}

.container {
    padding: 20px;
}

.orders {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
}

.order {
    background: #1f2937;
    border-radius: 16px;
    padding: 18px;
    border: 2px solid #374151;
}

.order.new {
    border-color: #f97316;
}

.order.ready {
    border-color: #22c55e;
}

.table {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 10px;
}

.time {
    color: #9ca3af;
    font-size: 13px;
}

.items {
    margin: 15px 0;
    line-height: 1.7;
}

.total {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 12px;
}

.ai {
    display: inline-block;
    background: #f97316;
    color: white;
    padding: 6px 9px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 12px;
}

.status {
    display: inline-block;
    padding: 7px 10px;
    border-radius: 8px;
    background: #374151;
    margin-bottom: 12px;
    font-size: 13px;
}

.actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 9px;
    padding: 10px 12px;
    cursor: pointer;
    font-weight: bold;
}

.orange {
    background: #f97316;
    color: white;
}

.green {
    background: #16a34a;
    color: white;
}

.blue {
    background: #2563eb;
    color: white;
}

.gray {
    background: #4b5563;
    color: white;
}

.empty {
    text-align: center;
    color: #9ca3af;
    padding: 70px 20px;
    font-size: 20px;
}

</style>

</head>

<body>

<header>

    <h1>
        👨‍🍳 AI Bistro — Mətbəx
    </h1>

    <div class="connection">
        🟢 LIVE
    </div>

</header>


<div class="container">

    <div
        id="orders"
        class="orders">

        <div class="empty">
            Sifarişlər yüklənir...
        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://lwxnxcebzhbpjmrboosf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_i2_aVgOrcZNYuwzlUGtK-w_kRhPDgmQ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

let orders = [];


/* SIFARISLERI YUKLE */

async function loadOrders() {

    const { data, error } =
        await supabaseClient
            .from("orders")
            .select("*")
            .in(
                "status",
                [
                    "Yeni sifariş",
                    "Hazırlanır",
                    "Hazırdır"
                ]
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );

    if (error) {

        console.error(error);

        document.getElementById("orders")
            .innerHTML = `
                <div class="empty">
                    Sifarişlər yüklənmədi.
                </div>
            `;

        return;
    }

    orders = data || [];

    renderOrders();
}


/* GOSTER */

function renderOrders() {

    const box =
        document.getElementById("orders");

    if (!orders.length) {

        box.innerHTML = `
            <div class="empty">
                🍽️ Hazırda aktiv sifariş yoxdur.
            </div>
        `;

        return;
    }


    box.innerHTML =
        orders.map(order => {

            const items =
                Array.isArray(order.items)
                    ? order.items
                    : [];


            const itemsHtml =
                items.map(item => `
                    <div>
                        • ${escapeHtml(item.name)}
                        — ${Number(item.price).toFixed(2)} AZN
                    </div>
                `).join("");


            let orderClass = "";

            if (
                order.status ===
                "Yeni sifariş"
            ) {

                orderClass = "new";

            }

            if (
                order.status ===
                "Hazırdır"
            ) {

                orderClass = "ready";

            }


            const date =
                new Date(
                    order.created_at
                );


            return `

                <div
                    class="order ${orderClass}">

                    <div class="table">

                        🪑 Masa ${order.table_number}

                    </div>


                    <div class="time">

                        ${date.toLocaleString("az-AZ")}

                    </div>


                    <br>


                    <div class="status">

                        ${escapeHtml(
                            order.status ||
                            "Yeni sifariş"
                        )}

                    </div>


                    ${
                        order.ai_used
                        ? `
                            <div class="ai">
                                🤖 AI sifarişi
                            </div>
                          `
                        : ""
                    }


                    <div class="items">

                        ${itemsHtml}

                    </div>


                    <div class="total">

                        ${Number(order.total).toFixed(2)}
                        AZN

                    </div>


                    <div class="actions">

                        <button
                            class="orange"
                            onclick="changeStatus(
                                ${order.id},
                                'Hazırlanır'
                            )">

                            🔥 Hazırlanır

                        </button>


                        <button
                            class="green"
                            onclick="changeStatus(
                                ${order.id},
                                'Hazırdır'
                            )">

                            ✅ Hazırdır

                        </button>


                        <button
                            class="blue"
                            onclick="changeStatus(
                                ${order.id},
                                'Təqdim edildi'
                            )">

                            🍽️ Təqdim edildi

                        </button>

                    </div>

                </div>

            `;

        }).join("");
}


/* STATUS */

async function changeStatus(
    id,
    status
) {

    const { error } =
        await supabaseClient
            .from("orders")
            .update({
                status: status
            })
            .eq("id", id);


    if (error) {

        alert(
            "Status dəyişmədi: " +
            error.message
        );

        return;
    }


    loadOrders();
}


/* ESCAPE */

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* REALTIME */

supabaseClient
    .channel("kitchen-orders")
    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "orders"
        },
        () => {

            loadOrders();

        }
    )
    .subscribe();


/* START */

loadOrders();

</script>

</body>

</html>
