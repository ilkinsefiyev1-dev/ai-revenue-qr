<!DOCTYPE html>
<html lang="az">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AI Bistro — Mətbəx</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
}

header {
    padding: 18px 25px;
    background: #020617;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 23px;
}

.live {
    background: #16a34a;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
}

.container {
    padding: 20px;
}

.orders {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
}

.order {
    background: #1f2937;
    border-radius: 15px;
    padding: 18px;
    border: 2px solid #374151;
}

.order.new {
    border-color: #f59e0b;
}

.order.preparing {
    border-color: #3b82f6;
}

.order.ready {
    border-color: #16a34a;
}

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.table {
    font-size: 21px;
    font-weight: bold;
}

.time {
    font-size: 12px;
    color: #9ca3af;
}

.status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 12px;
}

.status.new {
    background: #f59e0b;
    color: #111827;
}

.status.preparing {
    background: #3b82f6;
    color: white;
}

.status.ready {
    background: #16a34a;
    color: white;
}

.items {
    background: #111827;
    border-radius: 10px;
    padding: 13px;
    margin-bottom: 15px;
    line-height: 1.8;
}

.item {
    border-bottom: 1px solid #374151;
    padding: 5px 0;
}

.item:last-child {
    border-bottom: none;
}

.total {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 14px;
}

.ai {
    background: #064e3b;
    color: #a7f3d0;
    padding: 7px 10px;
    border-radius: 7px;
    font-size: 12px;
    margin-bottom: 12px;
    display: inline-block;
}

.buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 9px;
    padding: 11px 13px;
    cursor: pointer;
    font-weight: bold;
}

.prepare {
    background: #f59e0b;
    color: #111827;
}

.ready {
    background: #16a34a;
    color: white;
}

.done {
    background: #6b7280;
    color: white;
}

.empty {
    text-align: center;
    color: #9ca3af;
    padding: 60px 20px;
    font-size: 20px;
}

.error {
    text-align: center;
    color: #fca5a5;
    padding: 40px;
}

@media(max-width:600px) {

    header {
        padding: 15px;
    }

    header h1 {
        font-size: 18px;
    }

    .container {
        padding: 12px;
    }

    .orders {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>


<header>

    <h1>
        👨‍🍳 AI Bistro — Mətbəx
    </h1>

    <div class="live">
        🟢 LIVE
    </div>

</header>


<div class="container">

    <div id="orders"
         class="orders">

        <div class="empty">
            🔄 Sifarişlər yüklənir...
        </div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://lwxnxcebzhbpjmrboosf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_i2_aVgOrcZNYuwzlUGtK-w_kRhPDgmQ";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders() {

    const container =
        document.getElementById(
            "orders"
        );


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("orders")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {
            throw error;
        }


        const orders =
            data || [];


        if (!orders.length) {

            container.innerHTML = `
                <div class="empty">
                    📭 Hazırda sifariş yoxdur.
                </div>
            `;

            return;
        }


        container.innerHTML = "";


        orders.forEach(order => {

            renderOrder(
                order,
                container
            );

        });


    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="error">
                ❌ Sifarişlər yüklənmədi.
            </div>
        `;

    }

}


/* =====================================================
   RENDER ORDER
===================================================== */

function renderOrder(
    order,
    container
) {

    const status =
        order.status ||
        "Yeni sifariş";


    let orderClass =
        "new";


    let statusClass =
        "new";


    if (
        status === "Hazırlanır"
    ) {

        orderClass =
            "preparing";

        statusClass =
            "preparing";

    }


    if (
        status === "Hazırdır"
    ) {

        orderClass =
            "ready";

        statusClass =
            "ready";

    }


    if (
        status === "Təqdim edildi"
    ) {

        orderClass =
            "ready";

        statusClass =
            "ready";

    }


    const items =
        Array.isArray(
            order.items
        )
        ? order.items
        : [];


    const itemsHTML =
        items.map(
            item => `

                <div class="item">

                    🍽️
                    ${escapeHtml(
                        item.name || ""
                    )}

                    <strong>
                        ${Number(
                            item.price || 0
                        ).toFixed(2)}
                        AZN
                    </strong>

                </div>

            `
        ).join("");


    const createdAt =
        order.created_at
        ? new Date(
            order.created_at
          ).toLocaleTimeString(
            "az-AZ",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
          )
        : "";


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "order " +
        orderClass;


    div.innerHTML = `

        <div class="order-header">

            <div class="table">
                🪑 Masa №
                ${order.table_number || 1}
            </div>

            <div class="time">
                ${createdAt}
            </div>

        </div>


        <div class="status ${statusClass}">
            ${escapeHtml(status)}
        </div>


        ${
            order.ai_used
            ? `
                <div class="ai">
                    🤖 AI əlavə satış
                </div>
            `
            : ""
        }


        <div class="items">

            ${itemsHTML}

        </div>


        <div class="total">

            Cəmi:
            ${Number(
                order.total || 0
            ).toFixed(2)}
            AZN

        </div>


        <div class="buttons">

            <button
                class="prepare"
                onclick="changeStatus(
                    ${order.id},
                    'Hazırlanır'
                )"
            >
                👨‍🍳 Hazırlanır
            </button>


            <button
                class="ready"
                onclick="changeStatus(
                    ${order.id},
                    'Hazırdır'
                )"
            >
                ✅ Hazırdır
            </button>


            <button
                class="done"
                onclick="changeStatus(
                    ${order.id},
                    'Təqdim edildi'
                )"
            >
                🍽️ Təqdim edildi
            </button>

        </div>

    `;


    container.appendChild(div);

}


/* =====================================================
   CHANGE STATUS
===================================================== */

async function changeStatus(
    id,
    status
) {

    const {
        error
    } =
        await supabaseClient
            .from("orders")
            .update({
                status: status
            })
            .eq(
                "id",
                id
            );


    if (error) {

        console.error(error);

        alert(
            "❌ Status dəyişdirilmədi."
        );

        return;
    }


    loadOrders();

}


/* =====================================================
   REALTIME
===================================================== */

function startRealtime() {

    supabaseClient
        .channel(
            "kitchen-orders"
        )
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "orders"
            },
            function(payload) {

                console.log(
                    "Yeni sifariş/dəyişiklik:",
                    payload
                );

                loadOrders();

            }
        )
        .subscribe();

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   START
===================================================== */

loadOrders();

startRealtime();

</script>

</body>
</html>
