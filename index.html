<!DOCTYPE html>
<html lang="az">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Bistro</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        .table-name {
            margin-top: 8px;
            font-size: 17px;
            opacity: 0.9;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .section {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.07);
        }

        .section h2 {
            margin-top: 0;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #eee;
            gap: 15px;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .product-price {
            color: #555;
        }

        button {
            border: none;
            border-radius: 9px;
            padding: 11px 16px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .add-button {
            background: #111827;
            color: white;
        }

        .add-button:hover {
            opacity: 0.9;
        }

        .ai-box {
            background: #f0fdf4;
            border: 2px solid #22c55e;
            border-radius: 14px;
            padding: 18px;
            margin-top: 18px;
        }

        .ai-title {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .ai-text {
            color: #444;
            line-height: 1.5;
        }

        .combo-price {
            margin-top: 10px;
        }

        .old-price {
            text-decoration: line-through;
            color: #888;
            margin-right: 8px;
        }

        .new-price {
            font-size: 20px;
            font-weight: bold;
            color: #16a34a;
        }

        .save-text {
            color: #16a34a;
            font-weight: bold;
            margin-top: 5px;
        }

        .combo-button {
            margin-top: 14px;
            background: #16a34a;
            color: white;
            width: 100%;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item-name {
            flex: 1;
        }

        .cart-item-price {
            white-space: nowrap;
        }

        .remove-button {
            margin-left: 8px;
            padding: 5px 8px;
            background: #fee2e2;
            color: #991b1b;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 20px;
            font-weight: bold;
        }

        .order-button {
            width: 100%;
            margin-top: 18px;
            background: #111827;
            color: white;
            font-size: 17px;
            padding: 15px;
        }

        .empty {
            color: #777;
            text-align: center;
            padding: 10px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #777;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }

        .ai-badge {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 5px 8px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 5px;
        }

        @media (max-width: 500px) {

            .container {
                padding: 12px;
            }

            .section {
                padding: 16px;
            }

            .menu-item {
                align-items: center;
            }

            .product-name {
                font-size: 16px;
            }

            button {
                padding: 10px 12px;
            }

            .cart-item {
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>

<header>

    <h1>🍽️ AI Bistro</h1>

    <div class="table-name">
        🪑 Masa №<span id="tableNumber">1</span>
    </div>

</header>


<div class="container">


    <!-- MENU -->

    <div class="section">

        <h2>🍔 Menyu</h2>

        <div id="menuList">

            <div class="loading">
                Menyu yüklənir...
            </div>

        </div>


        <!-- AI RECOMMENDATION -->

        <div
            id="aiRecommendation"
            class="ai-box"
            style="display:none;"
        >

            <div class="ai-title">
                🤖 AI tövsiyəsi
            </div>

            <div
                id="aiText"
                class="ai-text"
            >
                Sizə uyğun məhsul tapıldı.
            </div>

            <div
                id="aiPrice"
                class="combo-price"
            >
            </div>

            <div
                id="aiSave"
                class="save-text"
            >
            </div>

            <button
                id="aiButton"
                class="combo-button"
                onclick="addAIRecommendationToCart()"
            >
                🤖 AI təklifini əlavə et
            </button>

        </div>

    </div>



    <!-- CART -->

    <div class="section">

        <h2>🛒 Sifarişiniz</h2>

        <div id="cartList">

            <div class="empty">
                Səbət boşdur.
            </div>

        </div>


        <div
            id="cartTotalArea"
            style="display:none;"
        >

            <div class="cart-total">

                <span>
                    Cəmi:
                </span>

                <span id="cartTotal">
                    0.00 AZN
                </span>

            </div>


            <button
                class="order-button"
                onclick="placeOrder()"
            >
                📤 Sifarişi göndər
            </button>

        </div>

    </div>



    <!-- MESSAGE -->

    <div id="message"></div>


</div>



<script>


/* ==================================================
   SUPABASE
   ================================================== */

const SUPABASE_URL =
    "https://lwxnxcebzhbpjmrboosf.supabase.co";


/*
   BURAYA ÖZ PUBLISHABLE KEY-İNİ YAZ.

   Məsələn:

   const SUPABASE_KEY =
       "sb_publishable_....";
*/

const SUPABASE_KEY =
    "sb_publishable_i2_aVgOrcZNYuwzlUGtK-w_kRhPDgmQ";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* ==================================================
   TABLE NUMBER
   ================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const tableNumber =
    params.get("table") || "1";


document.getElementById(
    "tableNumber"
).textContent = tableNumber;



/* ==================================================
   GLOBAL DATA
   ================================================== */

let menu = [];

let aiRules = [];

let cart = [];

let aiUsed = false;

let currentAIRule = null;

let dismissedAIRules = new Set();



/* ==================================================
   ESCAPE HTML
   ================================================== */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text == null
            ? ""
            : String(text);

    return div.innerHTML;
}



/* ==================================================
   LOAD MENU FROM SUPABASE
   ================================================== */

async function loadMenu() {

    const menuList =
        document.getElementById(
            "menuList"
        );

    menuList.innerHTML = `
        <div class="loading">
            Menyu yüklənir...
        </div>
    `;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("menu")
            .select("*")
            .eq("active", true)
            .order("id");


    if (error) {

        console.error(
            "Menu error:",
            error
        );

        menuList.innerHTML = `
            <div class="error">
                ❌ Menyu yüklənmədi.
            </div>
        `;

        return;
    }


    menu =
        data || [];


    renderMenu();

    updateAIRecommendation();

}



/* ==================================================
   RENDER MENU
   ================================================== */

function renderMenu() {

    const menuList =
        document.getElementById(
            "menuList"
        );


    menuList.innerHTML = "";


    if (!menu.length) {

        menuList.innerHTML = `
            <div class="empty">
                Hazırda aktiv məhsul yoxdur.
            </div>
        `;

        return;
    }


    menu.forEach(
        product => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "menu-item";


            item.innerHTML = `

                <div class="product-info">

                    <div class="product-name">
                        ${escapeHtml(product.name)}
                    </div>

                    <div class="product-price">
                        ${Number(product.price).toFixed(2)} AZN
                    </div>

                </div>


                <button
                    class="add-button"
                    onclick="addToCart(${Number(product.id)})"
                >
                    ➕ Əlavə et
                </button>

            `;


            menuList.appendChild(
                item
            );

        }
    );

}



/* ==================================================
   LOAD AI RULES FROM SUPABASE
   ================================================== */

async function loadAIRules() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("ai_recommendations")
            .select("*")
            .eq("active", true)
            .order("id");


    if (error) {

        console.error(
            "AI rules error:",
            error
        );

        aiRules = [];

        updateAIRecommendation();

        return;
    }


    aiRules =
        data || [];


    console.log(
        "AI rules:",
        aiRules
    );


    updateAIRecommendation();

}



/* ==================================================
   ADD NORMAL PRODUCT TO CART
   ================================================== */

function addToCart(productId) {

    const product =
        menu.find(
            p =>
                Number(p.id) ===
                Number(productId)
        );


    if (!product) {

        alert(
            "Məhsul tapılmadı."
        );

        return;
    }


    cart.push({

        id:
            Number(product.id),

        name:
            product.name,

        price:
            Number(product.price),

        aiItem:
            false

    });


    renderCart();

    updateAIRecommendation();

}



/* ==================================================
   FIND BEST AI RECOMMENDATION
   ================================================== */

function findBestAIRecommendation() {

    if (!cart.length) {
        return null;
    }


    /*
       Səbətdəki məhsulların ID-ləri
    */

    const cartProductIds =
        new Set(

            cart
                .filter(
                    item =>
                        !item.aiItem
                )
                .map(
                    item =>
                        Number(
                            item.id
                        )
                )

        );


    /*
       Bütün aktiv AI qaydalarına baxırıq.
    */

    const possibleRules =
        aiRules.filter(
            rule => {

                const triggerId =
                    Number(
                        rule.trigger_product_id
                    );


                const recommendedId =
                    Number(
                        rule.recommended_product_id
                    );


                /*
                   Trigger səbətdə olmalıdır.
                */

                if (
                    !cartProductIds.has(
                        triggerId
                    )
                ) {

                    return false;

                }


                /*
                   Tövsiyə olunan məhsul
                   artıq səbətdədirsə göstərmə.
                */

                if (
                    cartProductIds.has(
                        recommendedId
                    )
                ) {

                    return false;

                }


                /*
                   İstifadəçi həmin AI qaydanı
                   əvvəl silibsə yenidən göstərmə.
                */

                if (
                    dismissedAIRules.has(
                        Number(rule.id)
                    )
                ) {

                    return false;

                }


                return true;

            }
        );


    if (!possibleRules.length) {

        return null;

    }


    /*
       Bir neçə qayda varsa,
       ilk uyğun qaydanı götürürük.

       Gələcəkdə burada AI scoring
       əlavə edə bilərik.
    */

    return possibleRules[0];

}



/* ==================================================
   UPDATE AI RECOMMENDATION
   ================================================== */

function updateAIRecommendation() {

    const aiBox =
        document.getElementById(
            "aiRecommendation"
        );


    const aiText =
        document.getElementById(
            "aiText"
        );


    const aiPrice =
        document.getElementById(
            "aiPrice"
        );


    const aiSave =
        document.getElementById(
            "aiSave"
        );


    const aiButton =
        document.getElementById(
            "aiButton"
        );


    currentAIRule =
        findBestAIRecommendation();


    /*
       Uyğun AI yoxdursa gizlət.
    */

    if (!currentAIRule) {

        aiBox.style.display =
            "none";

        return;
    }


    const triggerProduct =
        menu.find(
            p =>
                Number(p.id) ===
                Number(
                    currentAIRule
                        .trigger_product_id
                )
        );


    const recommendedProduct =
        menu.find(
            p =>
                Number(p.id) ===
                Number(
                    currentAIRule
                        .recommended_product_id
                )
        );


    /*
       Məhsul tapılmasa AI göstərmə.
    */

    if (
        !triggerProduct ||
        !recommendedProduct
    ) {

        aiBox.style.display =
            "none";

        return;
    }


    const triggerPrice =
        Number(
            triggerProduct.price
        );


    const recommendedPrice =
        Number(
            recommendedProduct.price
        );


    /*
       combo_price bizim sistemdə
       tövsiyə olunan məhsulun xüsusi
       AI qiyməti kimi istifadə olunur.

       Əgər combo_price boşdursa,
       normal qiymətdən istifadə edilir.
    */

    let offerPrice =
        Number(
            currentAIRule.combo_price
        );


    if (
        !Number.isFinite(
            offerPrice
        ) ||
        offerPrice <= 0
    ) {

        offerPrice =
            recommendedPrice;

    }


    const saving =
        Math.max(
            0,
            recommendedPrice -
            offerPrice
        );


    aiText.innerHTML = `

        <span class="ai-badge">
            AI
        </span>

        ${escapeHtml(triggerProduct.name)}
        seçdiniz.

        Yanında
        <strong>
            ${escapeHtml(recommendedProduct.name)}
        </strong>
        sizin üçün uyğun ola bilər.
    `;


    /*
       Qiymət
    */

    if (saving > 0) {

        aiPrice.innerHTML = `

            <span class="old-price">
                ${recommendedPrice.toFixed(2)} AZN
            </span>

            <span class="new-price">
                ${offerPrice.toFixed(2)} AZN
            </span>

        `;

        aiSave.textContent =
            `💰 ${saving.toFixed(2)} AZN qənaət edirsiniz`;

    } else {

        aiPrice.innerHTML = `

            <span class="new-price">
                ${offerPrice.toFixed(2)} AZN
            </span>

        `;

        aiSave.textContent =
            "✨ AI sizin üçün uyğun məhsul seçdi";

    }


    aiButton.textContent =
        `🤖 ${recommendedProduct.name} əlavə et — ${offerPrice.toFixed(2)} AZN`;


    aiBox.style.display =
        "block";

}



/* ==================================================
   ADD AI RECOMMENDATION TO CART
   ================================================== */

function addAIRecommendationToCart() {

    if (!currentAIRule) {

        alert(
            "Hazırda AI tövsiyəsi yoxdur."
        );

        return;

    }


    const rule =
        currentAIRule;


    const recommendedProduct =
        menu.find(
            p =>
                Number(p.id) ===
                Number(
                    rule.recommended_product_id
                )
        );


    if (!recommendedProduct) {

        alert(
            "AI məhsulu tapılmadı."
        );

        return;

    }


    /*
       Eyni məhsul artıq səbətdədirsə
       ikinci dəfə əlavə etmə.
    */

    const alreadyInCart =
        cart.some(
            item =>
                !item.aiItem &&
                Number(item.id) ===
                Number(
                    recommendedProduct.id
                )
        );


    if (alreadyInCart) {

        alert(
            "Bu məhsul artıq səbətdədir."
        );

        updateAIRecommendation();

        return;

    }


    let offerPrice =
        Number(
            rule.combo_price
        );


    if (
        !Number.isFinite(
            offerPrice
        ) ||
        offerPrice <= 0
    ) {

        offerPrice =
            Number(
                recommendedProduct.price
            );

    }


    /*
       AI məhsulu
       */

    cart.push({

        id:
            "ai-" +
            rule.id +
            "-" +
            Date.now(),

        name:
            "🤖 " +
            recommendedProduct.name,

        price:
            offerPrice,

        aiItem:
            true,

        aiRuleId:
            Number(rule.id),

        originalProductId:
            Number(
                recommendedProduct.id
            )

    });


    aiUsed = true;


    /*
       Bu qaydanı artıq istifadə etdik.
    */

    dismissedAIRules.add(
        Number(rule.id)
    );


    renderCart();

    updateAIRecommendation();


    alert(
        "🤖 AI tövsiyəsi səbətə əlavə edildi!"
    );

}



/* ==================================================
   REMOVE FROM CART
   ================================================== */

function removeFromCart(index) {

    const item =
        cart[index];


    if (
        item &&
        item.aiItem &&
        item.aiRuleId
    ) {

        dismissedAIRules.add(
            Number(
                item.aiRuleId
            )
        );

    }


    cart.splice(
        index,
        1
    );


    renderCart();

    updateAIRecommendation();

}



/* ==================================================
   RENDER CART
   ================================================== */

function renderCart() {

    const cartList =
        document.getElementById(
            "cartList"
        );


    const totalArea =
        document.getElementById(
            "cartTotalArea"
        );


    const totalElement =
        document.getElementById(
            "cartTotal"
        );


    if (!cart.length) {

        cartList.innerHTML = `
            <div class="empty">
                Səbət boşdur.
            </div>
        `;


        totalArea.style.display =
            "none";


        return;

    }


    cartList.innerHTML = "";


    let total = 0;


    cart.forEach(
        (item, index) => {

            total +=
                Number(item.price);


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "cart-item";


            div.innerHTML = `

                <span class="cart-item-name">

                    ${
                        item.aiItem
                            ? '<span class="ai-badge">AI</span>'
                            : ''
                    }

                    ${escapeHtml(item.name)}

                </span>


                <span class="cart-item-price">

                    ${Number(item.price).toFixed(2)}
                    AZN


                    <button
                        class="remove-button"
                        onclick="removeFromCart(${index})"
                    >
                        ✕
                    </button>

                </span>

            `;


            cartList.appendChild(
                div
            );

        }
    );


    totalElement.textContent =
        total.toFixed(2) +
        " AZN";


    totalArea.style.display =
        "block";

}



/* ==================================================
   CALCULATE TOTAL
   ================================================== */

function calculateTotal() {

    return cart.reduce(

        (sum, item) =>

            sum +
            Number(item.price),

        0

    );

}



/* ==================================================
   SHOW MESSAGE
   ================================================== */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.innerHTML = `
        <div class="${type}">
            ${text}
        </div>
    `;

}



/* ==================================================
   PLACE ORDER
   ================================================== */

async function placeOrder() {

    if (!cart.length) {

        alert(
            "Səbət boşdur."
        );

        return;

    }


    const total =
        calculateTotal();


    const orderItems =
        cart.map(
            item => ({

                id:
                    item.originalProductId ||
                    item.id,

                name:
                    item.name,

                price:
                    Number(
                        item.price
                    ),

                ai:
                    Boolean(
                        item.aiItem
                    ),

                ai_rule_id:
                    item.aiRuleId ||
                    null

            })
        );


    const orderData = {

        table_number:
            Number(
                tableNumber
            ),

        items:
            orderItems,

        total:
            Number(
                total.toFixed(2)
            ),

        ai_used:
            aiUsed,

        status:
            "Yeni sifariş"

    };


    const button =
        document.querySelector(
            ".order-button"
        );


    button.disabled =
        true;


    button.textContent =
        "⏳ Göndərilir...";


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("orders")
                .insert([
                    orderData
                ])
                .select();


        if (error) {

            console.error(
                "Supabase error:",
                error
            );

            throw error;

        }


        console.log(
            "Sifariş göndərildi:",
            data
        );


        saveLocalOrder(
            orderData
        );


        showMessage(

            "✅ Sifariş uğurla göndərildi! Restoran sifarişi aldı.",

            "success"

        );


        alert(
            "Sifariş göndərildi! 🍽️"
        );


        cart = [];


        aiUsed = false;


        dismissedAIRules.clear();


        renderCart();

        updateAIRecommendation();


    } catch (error) {

        console.error(
            error
        );


        showMessage(

            "❌ Sifariş göndərilmədi. Supabase bağlantısını yoxla.",

            "error"

        );


        alert(
            "Sifariş göndərilmədi. ❌"
        );

    }


    button.disabled =
        false;


    button.textContent =
        "📤 Sifarişi göndər";

}



/* ==================================================
   LOCAL TEST ORDER
   ================================================== */

function saveLocalOrder(
    orderData
) {

    const orders =
        JSON.parse(

            localStorage.getItem(
                "orders"
            ) ||
            "[]"

        );


    orders.push({

        id:
            Date.now(),

        table:
            orderData.table_number,

        items:
            orderData.items,

        total:
            orderData.total,

        aiUsed:
            orderData.ai_used,

        status:
            orderData.status

    });


    localStorage.setItem(

        "orders",

        JSON.stringify(
            orders
        )

    );

}



/* ==================================================
   REALTIME — MENU
   ================================================== */

supabaseClient
    .channel(
        "menu-realtime"
    )
    .on(

        "postgres_changes",

        {
            event: "*",
            schema: "public",
            table: "menu"
        },

        payload => {

            console.log(
                "Menu dəyişdi:",
                payload
            );

            loadMenu();

        }

    )
    .subscribe();



/* ==================================================
   REALTIME — AI RULES
   ================================================== */

supabaseClient
    .channel(
        "ai-rules-realtime"
    )
    .on(

        "postgres_changes",

        {
            event: "*",
            schema: "public",
            table: "ai_recommendations"
        },

        payload => {

            console.log(
                "AI qaydası dəyişdi:",
                payload
            );

            loadAIRules();

        }

    )
    .subscribe();



/* ==================================================
   START
   ================================================== */

async function startApp() {

    await loadMenu();

    await loadAIRules();

    renderCart();

    updateAIRecommendation();

}


startApp();


</script>
