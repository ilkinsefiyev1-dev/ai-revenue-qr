<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Bistro - QR Menu</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 22px 16px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .table {
            font-size: 15px;
            opacity: .85;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 18px;
            padding-bottom: 120px;
        }

        .section-title {
            margin: 8px 0 15px;
            font-size: 22px;
        }

        .product {
            background: white;
            border-radius: 15px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.07);
        }

        .product-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .product-price {
            color: #555;
            margin-bottom: 12px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 11px 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-btn {
            width: 100%;
            background: #111827;
            color: white;
        }

        .add-btn:active {
            transform: scale(.98);
        }

        .ai-box {
            background: linear-gradient(135deg, #fff7ed, #ffedd5);
            border: 2px solid #fb923c;
            border-radius: 16px;
            padding: 17px;
            margin: 18px 0;
            display: none;
        }

        .ai-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .ai-text {
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .ai-btn {
            background: #f97316;
            color: white;
            width: 100%;
        }

        .cart {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            border-top: 1px solid #ddd;
            padding: 12px 16px;
            box-shadow: 0 -4px 15px rgba(0,0,0,.1);
            z-index: 10;
        }

        .cart-inner {
            max-width: 700px;
            margin: auto;
        }

        .cart-title {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .cart-items {
            font-size: 14px;
            color: #555;
            max-height: 80px;
            overflow-y: auto;
        }

        .cart-total {
            font-size: 18px;
            font-weight: bold;
            margin: 8px 0;
        }

        .order-btn {
            width: 100%;
            background: #16a34a;
            color: white;
            font-size: 16px;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 30px 0;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        .success {
            display: none;
            background: #dcfce7;
            color: #166534;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }

        .error {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>🍽️ AI Bistro</h1>
    <div class="table">
        🪑 Masa №<span id="tableNumber">1</span>
    </div>
</header>

<div class="container">

    <div id="successMessage" class="success">
        ✅ Sifarişiniz qəbul edildi!
    </div>

    <div id="errorMessage" class="error"></div>

    <h2 class="section-title">Menyu</h2>

    <div id="menu">
        <div class="loading">Menyu yüklənir...</div>
    </div>

    <div id="aiBox" class="ai-box">
        <div class="ai-title">🤖 AI tövsiyəsi</div>

        <div class="ai-text">
            Burger seçdiniz. 🍔
            Yanında kartof və kola ilə xüsusi
            <b>Combo</b> daha sərfəlidir.
        </div>

        <button class="ai-btn" onclick="addCombo()">
            🍟 Fries + 🥤 Cola Combo — 4.50 AZN
        </button>
    </div>

</div>

<div class="cart">
    <div class="cart-inner">

        <div class="cart-title">
            🛒 Səbət
        </div>

        <div id="cartItems" class="cart-items">
            Səbət boşdur
        </div>

        <div class="cart-total">
            Cəmi: <span id="cartTotal">0.00</span> AZN
        </div>

        <button class="order-btn" onclick="sendOrder()">
            📲 Sifarişi göndər
        </button>

    </div>
</div>

<script>

const SUPABASE_URL =
    "https://lwxnxcebzhbpjmrboosf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_i2_aVgOrcZNYuwzlUGtK-w_kRhPDgmQ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

let menu = [];
let cart = [];
let aiUsed = false;

/* MASA NOMRESI */

const params = new URLSearchParams(window.location.search);

let tableNumber =
    parseInt(params.get("table")) || 1;

document.getElementById("tableNumber").textContent =
    tableNumber;


/* MENYU YUKLE */

async function loadMenu() {

    const { data, error } =
        await supabaseClient
            .from("menu")
            .select("*")
            .eq("active", true)
            .order("id");

    if (error) {

        console.error(error);

        document.getElementById("menu").innerHTML =
            "<div class='empty'>Menyu yüklənmədi.</div>";

        return;
    }

    menu = data || [];

    renderMenu();
}


/* MENYU GOSTER */

function renderMenu() {

    const menuDiv =
        document.getElementById("menu");

    if (!menu.length) {

        menuDiv.innerHTML =
            "<div class='empty'>Hazırda menyu boşdur.</div>";

        return;
    }

    menuDiv.innerHTML =
        menu.map(product => `

            <div class="product">

                <div class="product-name">
                    ${escapeHtml(product.name)}
                </div>

                <div class="product-price">
                    ${Number(product.price).toFixed(2)} AZN
                </div>

                <button
                    class="add-btn"
                    onclick="addToCart(${product.id})">

                    + Səbətə əlavə et

                </button>

            </div>

        `).join("");
}


/* SEBETE ELAVE */

function addToCart(id) {

    const product =
        menu.find(item => item.id === id);

    if (!product) return;

    cart.push({
        id: product.id,
        name: product.name,
        price: Number(product.price)
    });

    renderCart();

    checkAIRecommendation();
}


/* AI REKOMENDASIYA */

function checkAIRecommendation() {

    const hasBurger =
        cart.some(item =>
            item.name.toLowerCase().includes("burger") ||
            item.id === 1
        );

    const hasFries =
        cart.some(item =>
            item.name.toLowerCase().includes("fries") ||
            item.name.toLowerCase().includes("kartof")
        );

    const hasCola =
        cart.some(item =>
            item.name.toLowerCase().includes("cola")
        );

    const hasCombo =
        cart.some(item =>
            item.name.toLowerCase().includes("combo")
        );

    const aiBox =
        document.getElementById("aiBox");

    if (
        hasBurger &&
        !hasFries &&
        !hasCola &&
        !hasCombo
    ) {

        aiBox.style.display = "block";

    } else {

        aiBox.style.display = "none";

    }
}


/* COMBO */

function addCombo() {

    const already =
        cart.some(item =>
            item.name.includes("Combo")
        );

    if (already) return;

    cart.push({
        id: "ai-combo",
        name: "🍟 Fries + 🥤 Cola Combo",
        price: 4.50
    });

    aiUsed = true;

    renderCart();

    document.getElementById("aiBox").style.display =
        "none";
}


/* SEBET */

function renderCart() {

    const itemsDiv =
        document.getElementById("cartItems");

    const totalDiv =
        document.getElementById("cartTotal");

    if (!cart.length) {

        itemsDiv.textContent =
            "Səbət boşdur";

        totalDiv.textContent =
            "0.00";

        return;
    }

    itemsDiv.innerHTML =
        cart.map(item => `
            <div>
                ${escapeHtml(item.name)}
                — ${item.price.toFixed(2)} AZN
            </div>
        `).join("");

    const total =
        cart.reduce(
            (sum, item) => sum + item.price,
            0
        );

    totalDiv.textContent =
        total.toFixed(2);
}


/* SIFARIS */

async function sendOrder() {

    if (!cart.length) {

        showError(
            "Səbət boşdur. Əvvəl məhsul seçin."
        );

        return;
    }

    const total =
        cart.reduce(
            (sum, item) => sum + item.price,
            0
        );

    const order = {

        table_number: tableNumber,

        items: cart,

        total: Number(total.toFixed(2)),

        ai_used: aiUsed,

        status: "Yeni sifariş"

    };


    const { data, error } =
        await supabaseClient
            .from("orders")
            .insert(order)
            .select()
            .single();


    if (error) {

        console.error(error);

        showError(
            "Sifariş göndərilmədi. Yenidən cəhd edin."
        );

        return;
    }


    localStorage.setItem(
        "lastOrder",
        JSON.stringify(data)
    );


    cart = [];

    aiUsed = false;

    renderCart();

    document.getElementById("successMessage")
        .style.display = "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ERROR */

function showError(message) {

    const box =
        document.getElementById("errorMessage");

    box.textContent = message;

    box.style.display = "block";

    setTimeout(() => {

        box.style.display = "none";

    }, 4000);
}


/* HTML QORUMA */

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* BASLAT */

loadMenu();

</script>

</body>
</html>
