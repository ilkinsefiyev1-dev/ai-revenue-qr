<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bistro</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 22px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 27px;
        }

        .table-name {
            margin-top: 8px;
            font-size: 17px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 18px;
        }

        .section {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 3px 15px rgba(0,0,0,.07);
        }

        h2 {
            margin-top: 0;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #eee;
            gap: 15px;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .product-price {
            color: #555;
        }

        button {
            border: none;
            border-radius: 9px;
            padding: 11px 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-button {
            background: #111827;
            color: white;
        }

        /* AI */
        .ai-box {
            margin-top: 20px;
            background: #f0fdf4;
            border: 2px solid #22c55e;
            border-radius: 15px;
            padding: 18px;
        }

        .ai-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .ai-text {
            line-height: 1.5;
            color: #444;
        }

        .old-price {
            text-decoration: line-through;
            color: #888;
            margin-right: 8px;
        }

        .new-price {
            color: #16a34a;
            font-size: 21px;
            font-weight: bold;
        }

        .save-text {
            color: #16a34a;
            font-weight: bold;
            margin-top: 7px;
        }

        .combo-button {
            width: 100%;
            margin-top: 15px;
            background: #16a34a;
            color: white;
            font-size: 16px;
        }

        /* CART */
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            gap: 10px;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 20px;
            font-weight: bold;
        }

        .order-button {
            width: 100%;
            margin-top: 18px;
            background: #111827;
            color: white;
            font-size: 17px;
            padding: 15px;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 15px;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body>

<header>
    <h1>🍽️ AI Bistro</h1>

    <div class="table-name">
        🪑 Masa №<span id="tableNumber">1</span>
    </div>
</header>

<div class="container">

    <!-- MENU -->
    <div class="section">

        <h2>🍔 Menyu</h2>

        <div id="menuList">
            Menyu yüklənir...
        </div>

        <!-- AI RECOMMENDATION -->
        <div id="aiRecommendation" class="ai-box" style="display:none;">

            <div class="ai-title">
                🤖 AI tövsiyəsi
            </div>

            <div class="ai-text">
                Chicken Burger seçdiniz! 🍔<br><br>
                Yanında Fries + Cola götürsəniz,
                xüsusi Combo ilə daha sərfəli olacaq.
            </div>

            <div style="margin-top:12px;">

                <span class="old-price">
                    5.00 AZN
                </span>

                <span class="new-price">
                    4.50 AZN
                </span>

            </div>

            <div class="save-text">
                💰 0.50 AZN qənaət edirsiniz
            </div>

            <button
                class="combo-button"
                onclick="addCombo()"
            >
                🍟🥤 Combo əlavə et — 4.50 AZN
            </button>

        </div>

    </div>

    <!-- CART -->
    <div class="section">

        <h2>🛒 Sifarişiniz</h2>

        <div id="cartList">
            <div class="empty">
                Səbət boşdur.
            </div>
        </div>

        <div id="cartTotalArea" style="display:none;">

            <div class="cart-total">
                <span>Cəmi:</span>

                <span id="cartTotal">
                    0.00 AZN
                </span>
            </div>

            <button
                class="order-button"
                onclick="placeOrder()"
            >
                📤 Sifarişi göndər
            </button>

        </div>

    </div>

    <div id="message"></div>

</div>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://lwxnxcebzhbpjmrboosf.supabase.co";

/*
   BURAYA ÖZ PUBLISHABLE KEY-İNİ YAZ
*/
const SUPABASE_KEY =
    "BURAYA_SENIN_PUBLISHABLE_KEYIN";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   MASA
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const tableNumber =
    params.get("table") || "1";

document.getElementById("tableNumber").textContent =
    tableNumber;


/* =====================================================
   DEFAULT MENU
===================================================== */

const defaultMenu = [

    {
        id: 1,
        name: "Chicken Burger",
        price: 9,
        active: true
    },

    {
        id: 2,
        name: "Fries",
        price: 3,
        active: true
    },

    {
        id: 3,
        name: "Cola",
        price: 2,
        active: true
    }

];


/* =====================================================
   MENU
===================================================== */

function getMenu() {

    let menu = null;

    try {

        menu = JSON.parse(
            localStorage.getItem("menu")
        );

    } catch (error) {

        menu = null;

    }

    if (!Array.isArray(menu) || menu.length === 0) {

        menu = defaultMenu;

        localStorage.setItem(
            "menu",
            JSON.stringify(menu)
        );
    }

    return menu;
}


/* =====================================================
   CART
===================================================== */

let cart = [];

let aiUsed = false;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =====================================================
   LOAD MENU
===================================================== */

function loadMenu() {

    const menu =
        getMenu().filter(
            item => item.active !== false
        );

    const menuList =
        document.getElementById("menuList");

    menuList.innerHTML = "";

    if (menu.length === 0) {

        menuList.innerHTML = `
            <div class="empty">
                Aktiv məhsul yoxdur.
            </div>
        `;

        return;
    }

    menu.forEach(product => {

        const div =
            document.createElement("div");

        div.className = "menu-item";

        div.innerHTML = `

            <div class="product-info">

                <div class="product-name">
                    ${escapeHtml(product.name)}
                </div>

                <div class="product-price">
                    ${Number(product.price).toFixed(2)} AZN
                </div>

            </div>

            <button
                class="add-button"
                onclick="addToCart(${Number(product.id)})"
            >
                ➕ Əlavə et
            </button>

        `;

        menuList.appendChild(div);

    });

    updateAIRecommendation();
}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(productId) {

    const menu = getMenu();

    const product =
        menu.find(
            item =>
                Number(item.id) ===
                Number(productId)
        );

    if (!product) {

        alert("Məhsul tapılmadı.");

        return;
    }

    cart.push({

        id: product.id,

        name: product.name,

        price: Number(product.price)

    });

    renderCart();

    updateAIRecommendation();

    console.log(
        "Səbət:",
        cart
    );
}


/* =====================================================
   🤖 AI RECOMMENDATION
===================================================== */

function updateAIRecommendation() {

    const aiBox =
        document.getElementById(
            "aiRecommendation"
        );

    if (!aiBox) {
        return;
    }

    /*
       Chicken Burger seçilib?
       ID 1-dirsə də AI işləyəcək.
    */

    const burgerExists =
        cart.some(item => {

            const name =
                String(item.name)
                    .toLowerCase();

            return (
                Number(item.id) === 1 ||
                name.includes("burger")
            );
        });


    /*
       Fries seçilib?
    */

    const friesExists =
        cart.some(item => {

            const name =
                String(item.name)
                    .toLowerCase();

            return name.includes("fries");
        });


    /*
       Cola seçilib?
    */

    const colaExists =
        cart.some(item => {

            const name =
                String(item.name)
                    .toLowerCase();

            return name.includes("cola");
        });


    /*
       Combo seçilib?
    */

    const comboExists =
        cart.some(item => {

            const name =
                String(item.name)
                    .toLowerCase();

            return name.includes("combo");
        });


    /*
       AI-nin əsas şərti:
       Burger VAR
       Fries YOX
       Cola YOX
       Combo YOX
    */

    if (
        burgerExists &&
        !friesExists &&
        !colaExists &&
        !comboExists
    ) {

        aiBox.style.display = "block";

        console.log(
            "🤖 AI TÖVSİYƏSİ GÖRÜNÜR"
        );

    } else {

        aiBox.style.display = "none";
    }
}


/* =====================================================
   ADD COMBO
===================================================== */

function addCombo() {

    const comboExists =
        cart.some(item =>
            String(item.name)
                .toLowerCase()
                .includes("combo")
        );

    if (comboExists) {

        alert(
            "Combo artıq səbətdədir."
        );

        return;
    }

    cart.push({

        id:
            "ai-combo-" +
            Date.now(),

        name:
            "🍟 Fries + 🥤 Cola Combo",

        price:
            4.50
    });

    aiUsed = true;

    renderCart();

    updateAIRecommendation();

    alert(
        "🤖 AI Combo səbətə əlavə edildi!"
    );
}


/* =====================================================
   REMOVE
===================================================== */

function removeFromCart(index) {

    cart.splice(index, 1);

    renderCart();

    updateAIRecommendation();
}


/* =====================================================
   CART
===================================================== */

function renderCart() {

    const cartList =
        document.getElementById(
            "cartList"
        );

    const totalArea =
        document.getElementById(
            "cartTotalArea"
        );

    const totalElement =
        document.getElementById(
            "cartTotal"
        );

    if (cart.length === 0) {

        cartList.innerHTML = `
            <div class="empty">
                Səbət boşdur.
            </div>
        `;

        totalArea.style.display =
            "none";

        return;
    }

    cartList.innerHTML = "";

    let total = 0;

    cart.forEach(
        (item, index) => {

            total +=
                Number(item.price);

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "cart-item";

            div.innerHTML = `

                <span>
                    ${escapeHtml(item.name)}
                </span>

                <span>

                    ${Number(item.price).toFixed(2)}
                    AZN

                    <button
                        onclick="removeFromCart(${index})"
                        style="
                            margin-left:8px;
                            background:#fee2e2;
                            color:#991b1b;
                            padding:5px 8px;
                        "
                    >
                        ✕
                    </button>

                </span>

            `;

            cartList.appendChild(div);

        }
    );

    totalElement.textContent =
        total.toFixed(2) +
        " AZN";

    totalArea.style.display =
        "block";
}


/* =====================================================
   TOTAL
===================================================== */

function calculateTotal() {

    return cart.reduce(
        (total, item) =>
            total + Number(item.price),
        0
    );
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text, type) {

    const message =
        document.getElementById(
            "message"
        );

    message.innerHTML = `
        <div class="message ${type}">
            ${text}
        </div>
    `;
}


/* =====================================================
   LOCAL ORDER
===================================================== */

function saveLocalOrder(order) {

    let orders = [];

    try {

        orders = JSON.parse(
            localStorage.getItem("orders") ||
            "[]"
        );

    } catch (error) {

        orders = [];
    }

    orders.push({

        id: Date.now(),

        table:
            order.table_number,

        items:
            order.items,

        total:
            order.total,

        aiUsed:
            order.ai_used,

        status:
            order.status
    });

    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );
}


/* =====================================================
   PLACE ORDER
===================================================== */

async function placeOrder() {

    if (cart.length === 0) {

        alert(
            "Səbət boşdur."
        );

        return;
    }

    const total =
        calculateTotal();

    const orderItems =
        cart.map(item => ({

            id:
                item.id,

            name:
                item.name,

            price:
                Number(item.price)

        }));

    const orderData = {

        table_number:
            Number(tableNumber),

        items:
            orderItems,

        total:
            Number(total.toFixed(2)),

        ai_used:
            Boolean(aiUsed),

        status:
            "Yeni sifariş"
    };

    const button =
        document.querySelector(
            ".order-button"
        );

    button.disabled = true;

    button.textContent =
        "⏳ Göndərilir...";

    try {

        const result =
            await supabaseClient
                .from("orders")
                .insert([
                    orderData
                ])
                .select();

        if (result.error) {

            console.error(
                "Supabase error:",
                result.error
            );

            throw result.error;
        }

        console.log(
            "Sifariş göndərildi:",
            result.data
        );

        saveLocalOrder(
            orderData
        );

        showMessage(
            "✅ Sifariş uğurla göndərildi!",
            "success"
        );

        alert(
            "Sifariş göndərildi! 🍽️"
        );

        cart = [];

        aiUsed = false;

        renderCart();

        updateAIRecommendation();

    } catch (error) {

        console.error(
            "Sifariş xətası:",
            error
        );

        showMessage(
            "❌ Sifariş göndərilmədi. Supabase məlumatlarını yoxla.",
            "error"
        );

        alert(
            "Sifariş göndərilmədi! ❌"
        );
    }

    button.disabled = false;

    button.textContent =
        "📤 Sifarişi göndər";
}


/* =====================================================
   START
===================================================== */

loadMenu();

renderCart();

updateAIRecommendation();

</script>

</body>
</html>
