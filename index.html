<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Bistro</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        .table-name {
            margin-top: 8px;
            font-size: 17px;
            opacity: 0.9;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .section {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.07);
        }

        .section h2 {
            margin-top: 0;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #eee;
            gap: 15px;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .product-price {
            color: #555;
        }

        button {
            border: none;
            border-radius: 9px;
            padding: 11px 16px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .add-button {
            background: #111827;
            color: white;
        }

        .add-button:hover {
            opacity: 0.9;
        }

        .ai-box {
            background: #f0fdf4;
            border: 2px solid #22c55e;
            border-radius: 14px;
            padding: 18px;
            margin-top: 18px;
        }

        .ai-title {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .ai-text {
            color: #444;
            line-height: 1.5;
        }

        .combo-price {
            margin-top: 10px;
        }

        .old-price {
            text-decoration: line-through;
            color: #888;
            margin-right: 8px;
        }

        .new-price {
            font-size: 20px;
            font-weight: bold;
            color: #16a34a;
        }

        .save-text {
            color: #16a34a;
            font-weight: bold;
            margin-top: 5px;
        }

        .combo-button {
            margin-top: 14px;
            background: #16a34a;
            color: white;
            width: 100%;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 20px;
            font-weight: bold;
        }

        .order-button {
            width: 100%;
            margin-top: 18px;
            background: #111827;
            color: white;
            font-size: 17px;
            padding: 15px;
        }

        .empty {
            color: #777;
            text-align: center;
            padding: 10px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #777;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 500px) {

            .container {
                padding: 12px;
            }

            .section {
                padding: 16px;
            }

            .menu-item {
                align-items: center;
            }

            .product-name {
                font-size: 16px;
            }

            button {
                padding: 10px 12px;
            }
        }

    </style>
</head>

<body>

<header>

    <h1>🍽️ AI Bistro</h1>

    <div class="table-name">
        🪑 Masa №<span id="tableNumber">1</span>
    </div>

</header>


<div class="container">


    <!-- MENU -->

    <div class="section">

        <h2>🍔 Menyu</h2>

        <div id="menuList">

            <div class="loading">
                Menyu yüklənir...
            </div>

        </div>


        <!-- AI RECOMMENDATION -->

        <div
            id="aiRecommendation"
            class="ai-box"
            style="display:none;"
        >

            <div class="ai-title">
                🤖 AI tövsiyəsi
            </div>

            <div class="ai-text">

                Chicken Burger seçdiniz.
                Yanında Fries + Cola daha sərfəlidir!

            </div>

            <div class="combo-price">

                <span class="old-price">
                    5.00 AZN
                </span>

                <span class="new-price">
                    4.50 AZN
                </span>

            </div>

            <div class="save-text">
                💰 0.50 AZN qənaət edirsiniz
            </div>

            <button
                class="combo-button"
                onclick="addCombo()"
            >
                🍟🥤 Combo əlavə et — 4.50 AZN
            </button>

        </div>

    </div>



    <!-- CART -->

    <div class="section">

        <h2>🛒 Sifarişiniz</h2>

        <div id="cartList">

            <div class="empty">
                Səbət boşdur.
            </div>

        </div>

        <div
            id="cartTotalArea"
            style="display:none;"
        >

            <div class="cart-total">

                <span>
                    Cəmi:
                </span>

                <span id="cartTotal">
                    0.00 AZN
                </span>

            </div>

            <button
                class="order-button"
                onclick="placeOrder()"
            >
                📤 Sifarişi göndər
            </button>

        </div>

    </div>


    <!-- MESSAGE -->

    <div id="message"></div>


</div>


<script>

/* ==================================================
   SUPABASE AYARLARI
   ================================================== */


/*
   1) BURAYA SUPABASE PROJECT URL YAZ.

   Məsələn:

   https://xxxxxxxx.supabase.co

   /rest/v1/ HİSSƏSİNİ YAZMA.
*/

const SUPABASE_URL =
    "https://lwxnxcebzhbpjmrboosf.supabase.co";


/*
   2) BURAYA API KEYS-DƏN KOPYALADIĞIN
   PUBLISHABLE KEY-I YAZ.

   SECRET KEY YAZMA!
*/

const SUPABASE_KEY =
    "sb_publishable_i2_aVgOrcZNYuwzlUGtK-w_kRhPDgmQ";


/*
   Supabase bağlantısı
*/

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==================================================
   TABLE NUMBER
   ================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const tableNumber =
    params.get("table") || "1";


document.getElementById(
    "tableNumber"
).textContent = tableNumber;


/* ==================================================
   DEFAULT MENU
   ================================================== */

const defaultMenu = [

    {
        id: 1,
        name: "Chicken Burger",
        price: 9,
        active: true
    },

    {
        id: 2,
        name: "Fries",
        price: 3,
        active: true
    },

    {
        id: 3,
        name: "Cola",
        price: 2,
        active: true
    }

];


/* ==================================================
   CART
   ================================================== */

let cart = [];

let aiUsed = false;


/* ==================================================
   GET MENU
   ================================================== */

function getMenu() {

    let menu =
        JSON.parse(
            localStorage.getItem("menu")
        );


    if (!menu) {

        menu = defaultMenu;

        localStorage.setItem(
            "menu",
            JSON.stringify(menu)
        );

    }


    return menu;

}


/* ==================================================
   LOAD MENU
   ================================================== */

function loadMenu() {

    const menu =
        getMenu().filter(
            product => product.active
        );


    const menuList =
        document.getElementById(
            "menuList"
        );


    menuList.innerHTML = "";


    if (!menu.length) {

        menuList.innerHTML =
            `
            <div class="empty">
                Hazırda aktiv məhsul yoxdur.
            </div>
            `;

        return;

    }


    menu.forEach(product => {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "menu-item";


        item.innerHTML = `

            <div class="product-info">

                <div class="product-name">
                    ${escapeHtml(product.name)}
                </div>

                <div class="product-price">
                    ${Number(product.price).toFixed(2)} AZN
                </div>

            </div>

            <button
                class="add-button"
                onclick="addToCart(${product.id})"
            >
                ➕ Əlavə et
            </button>

        `;


        menuList.appendChild(item);

    });


    updateAIRecommendation();

}


/* ==================================================
   ESCAPE HTML
   ================================================== */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* ==================================================
   ADD TO CART
   ================================================== */

function addToCart(productId) {

    const menu =
        getMenu();


    const product =
        menu.find(
            p => p.id === productId
        );


    if (!product) {

        alert("Məhsul tapılmadı.");

        return;

    }


    cart.push({

        id: product.id,

        name: product.name,

        price: Number(product.price)

    });


    renderCart();

    updateAIRecommendation();

}


/* ==================================================
   ADD AI COMBO
   ================================================== */

function addCombo() {

    const comboAlreadyAdded =
        cart.some(
            item =>
                item.name ===
                "🍟 Fries + 🥤 Cola Combo"
        );


    if (comboAlreadyAdded) {

        alert(
            "Combo artıq səbətdədir."
        );

        return;

    }


    cart.push({

        id: "ai-combo-" + Date.now(),

        name: "🍟 Fries + 🥤 Cola Combo",

        price: 4.50

    });


    aiUsed = true;


    renderCart();

    updateAIRecommendation();


    alert(
        "AI Combo səbətə əlavə edildi! 🤖"
    );

}


/* ==================================================
   REMOVE FROM CART
   ================================================== */

function removeFromCart(index) {

    cart.splice(index, 1);

    renderCart();

    updateAIRecommendation();

}


/* ==================================================
   RENDER CART
   ================================================== */

function renderCart() {

    const cartList =
        document.getElementById(
            "cartList"
        );


    const totalArea =
        document.getElementById(
            "cartTotalArea"
        );


    const totalElement =
        document.getElementById(
            "cartTotal"
        );


    if (!cart.length) {

        cartList.innerHTML =
            `
            <div class="empty">
                Səbət boşdur.
            </div>
            `;

        totalArea.style.display =
            "none";

        return;

    }


    cartList.innerHTML = "";


    let total = 0;


    cart.forEach(
        (item, index) => {

            total +=
                Number(item.price);


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "cart-item";


            div.innerHTML = `

                <span>
                    ${escapeHtml(item.name)}
                </span>

                <span>

                    ${Number(item.price).toFixed(2)}
                    AZN

                    <button
                        class="remove-button"
                        onclick="removeFromCart(${index})"
                        style="
                            margin-left:8px;
                            padding:5px 8px;
                            background:#fee2e2;
                            color:#991b1b;
                        "
                    >
                        ✕
                    </button>

                </span>

            `;


            cartList.appendChild(div);

        }
    );


    totalElement.textContent =
        total.toFixed(2) +
        " AZN";


    totalArea.style.display =
        "block";

}


/* ==================================================
   UPDATE AI RECOMMENDATION
   ================================================== */

function updateAIRecommendation() {

    const aiBox =
        document.getElementById(
            "aiRecommendation"
        );


    const hasBurger =
        cart.some(
            item =>
                item.name ===
                "Chicken Burger"
        );


    const hasFries =
        cart.some(
            item =>
                item.name === "Fries"
        );


    const hasCola =
        cart.some(
            item =>
                item.name === "Cola"
        );


    const hasCombo =
        cart.some(
            item =>
                item.name.includes("Combo")
        );


    if (
        hasBurger &&
        !hasFries &&
        !hasCola &&
        !hasCombo
    ) {

        aiBox.style.display =
            "block";

    } else {

        aiBox.style.display =
            "none";

    }

}


/* ==================================================
   CALCULATE TOTAL
   ================================================== */

function calculateTotal() {

    return cart.reduce(
        (sum, item) =>
            sum + Number(item.price),
        0
    );

}


/* ==================================================
   SHOW MESSAGE
   ================================================== */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.innerHTML =
        `
        <div class="${type}">
            ${text}
        </div>
        `;

}


/* ==================================================
   PLACE ORDER
   ================================================== */

async function placeOrder() {

    if (!cart.length) {

        alert(
            "Səbət boşdur."
        );

        return;

    }


    const total =
        calculateTotal();


    const orderItems =
        cart.map(item => ({

            id: item.id,

            name: item.name,

            price: Number(item.price)

        }));


    const orderData = {

        table_number:
            Number(tableNumber),

        items:
            orderItems,

        total:
            Number(total.toFixed(2)),

        ai_used:
            aiUsed,

        status:
            "Yeni sifariş"

    };


    const button =
        document.querySelector(
            ".order-button"
        );


    button.disabled = true;

    button.textContent =
        "⏳ Göndərilir...";


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("orders")
                .insert([
                    orderData
                ])
                .select();


        if (error) {

            console.error(
                "Supabase error:",
                error
            );

            throw error;

        }


        console.log(
            "Sifariş Supabase-ə göndərildi:",
            data
        );


        /*
           Lokal test üçün də saxlayırıq.
           Sonrakı mərhələdə bunu tamamilə
           Supabase sisteminə keçirəcəyik.
        */

        saveLocalOrder(
            orderData
        );


        showMessage(
            "✅ Sifariş uğurla göndərildi! Restoran sifarişi aldı.",
            "success"
        );


        alert(
            "Sifariş göndərildi! 🍽️"
        );


        cart = [];

        aiUsed = false;


        renderCart();

        updateAIRecommendation();


    } catch (error) {

        console.error(error);


        showMessage(
            "❌ Sifariş göndərilmədi. İnternet bağlantısını və Supabase məlumatlarını yoxla.",
            "error"
        );


        alert(
            "Sifariş göndərilmədi. ❌"
        );

    }


    button.disabled = false;

    button.textContent =
        "📤 Sifarişi göndər";

}


/* ==================================================
   LOCAL TEST ORDER
   ================================================== */

function saveLocalOrder(
    orderData
) {

    const orders =
        JSON.parse(
            localStorage.getItem(
                "orders"
            ) || "[]"
        );


    orders.push({

        id: Date.now(),

        table:
            orderData.table_number,

        items:
            orderData.items,

        total:
            orderData.total,

        aiUsed:
            orderData.ai_used,

        status:
            orderData.status

    });


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );

}


/* ==================================================
   START
   ================================================== */

loadMenu();

renderCart();

</script>

</body>
</html>
