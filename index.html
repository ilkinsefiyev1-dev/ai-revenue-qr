<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Bistro</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222
}

header{
    background:#111827;
    color:white;
    padding:25px 20px;
    text-align:center
}

header h1{
    margin:0 0 8px;
    font-size:28px
}

header p{
    margin:0;
    color:#d1d5db
}

.table{
    display:inline-block;
    margin-top:15px;
    padding:8px 14px;
    background:#374151;
    border-radius:20px;
    font-size:14px
}

.container{
    max-width:700px;
    margin:25px auto;
    padding:0 15px 40px
}

.section-title{
    font-size:22px;
    margin:25px 0 15px
}

.product{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.07)
}

.product-info{
    flex:1
}

.product-info h3{
    margin:0 0 7px
}

.product-info p{
    margin:0;
    color:#777
}

.price{
    font-weight:bold;
    font-size:18px;
    margin-top:7px
}

button{
    border:0;
    cursor:pointer;
    border-radius:10px;
    padding:11px 15px;
    font-size:14px
}

.add-btn{
    background:#111827;
    color:white
}

.ai-card{
    background:#fff7d6;
    border:1px solid #efd56b;
    border-radius:18px;
    padding:20px;
    margin:20px 0
}

.ai-card h3{
    margin-top:0
}

.ai-card p{
    line-height:1.5
}

.old-price{
    color:#888;
    text-decoration:line-through;
    margin-right:8px
}

.new-price{
    font-size:20px;
    font-weight:bold
}

.combo-btn{
    width:100%;
    background:#eab308;
    color:#111;
    font-weight:bold;
    margin-top:10px
}

.cart{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-top:25px;
    box-shadow:0 3px 12px rgba(0,0,0,.08)
}

.cart-item{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #eee
}

.empty-cart{
    color:#888;
    text-align:center;
    padding:10px
}

.cart-total{
    text-align:right;
    font-size:22px;
    font-weight:bold;
    margin-top:18px
}

.order-btn{
    width:100%;
    margin-top:18px;
    background:#16a34a;
    color:white;
    font-size:17px;
    font-weight:bold;
    padding:15px
}

@media(max-width:500px){
    .product{
        align-items:flex-start
    }
}
</style>
</head>

<body>

<header>

<h1>🍽️ AI Bistro</h1>

<p>AI ilə daha ağıllı sifariş</p>

<div class="table">
🪑 Masa №<span id="tableNumber">1</span>
</div>

</header>


<div class="container">

<h2 class="section-title">
🍔 Menyu
</h2>

<div id="menuContainer"></div>


<div id="aiRecommendation"></div>


<div class="cart">

<h2>🛒 Səbət</h2>

<div id="cartItems">
<div class="empty-cart">
Səbət boşdur.
</div>
</div>

<div id="cartTotal" class="cart-total">
Cəmi: 0.00 AZN
</div>

<button
class="order-btn"
onclick="placeOrder()">

Sifarişi göndər

</button>

</div>

</div>


<script>

let cart=[];

let aiUsed=false;


// ================================
// TABLE NUMBER
// ================================

const params=
new URLSearchParams(window.location.search);

const tableNumber=
params.get("table") || "1";

document.getElementById("tableNumber")
.textContent=tableNumber;


// ================================
// MENU
// ================================

const defaultMenu=[

{
id:1,
name:"🍔 Chicken Burger",
price:9,
active:true
},

{
id:2,
name:"🍟 Fries",
price:3,
active:true
},

{
id:3,
name:"🥤 Cola",
price:2,
active:true
}

];


function getMenu(){

const saved=
localStorage.getItem("menu");

if(!saved){

localStorage.setItem(
"menu",
JSON.stringify(defaultMenu)
);

return defaultMenu;
}

return JSON.parse(saved);

}


function renderMenu(){

const menu=getMenu();

const container=
document.getElementById("menuContainer");

container.innerHTML="";


const activeProducts=
menu.filter(product=>product.active);


if(activeProducts.length===0){

container.innerHTML=`

<div class="empty-cart">
Hazırda menyuda məhsul yoxdur.
</div>

`;

return;
}


activeProducts.forEach(product=>{

container.innerHTML+=`

<div class="product">

<div class="product-info">

<h3>
${product.name}
</h3>

<p>
Dadlı və keyfiyyətli seçim
</p>

<div class="price">
${Number(product.price).toFixed(2)} AZN
</div>

</div>


<button
class="add-btn"
onclick="addToCart(
'${product.name.replace(/'/g,"\\'")}',
${product.price}
)">

Əlavə et

</button>

</div>

`;

});

}


// ================================
// ADD TO CART
// ================================

function addToCart(name,price){

cart.push({
name:name,
price:Number(price)
});

renderCart();

showAIRecommendation();

}


// ================================
// AI RECOMMENDATION
// ================================

function showAIRecommendation(){

const box=
document.getElementById(
"aiRecommendation"
);


const burger=
cart.some(item=>
item.name.includes("Chicken Burger")
);


const fries=
cart.some(item=>
item.name.includes("Fries")
);


const cola=
cart.some(item=>
item.name.includes("Cola")
);


if(
burger &&
!fries &&
!cola
){

box.innerHTML=`

<div class="ai-card">

<h3>
🤖 Sizə xüsusi tövsiyəmiz
</h3>

<p>
Chicken Burger ilə ən çox seçilən kombinasiya:
</p>

<p>
🍟 Fries + 🥤 Cola
</p>

<p>

<span class="old-price">
5.00 AZN
</span>

<span class="new-price">
4.50 AZN
</span>

</p>

<p>
💡 0.50 AZN qənaət edin.
</p>

<button
class="combo-btn"
onclick="addCombo()">

Combo əlavə et — 4.50 AZN

</button>

</div>

`;

}else{

box.innerHTML="";

}

}


// ================================
// ADD COMBO
// ================================

function addCombo(){

const fries=
cart.some(item=>
item.name.includes("Fries")
);


const cola=
cart.some(item=>
item.name.includes("Cola")
);


if(fries || cola){

return;
}


cart.push({

name:"🍟 Fries + 🥤 Cola Combo",

price:4.50

});


aiUsed=true;

renderCart();

showAIRecommendation();

}


// ================================
// CART
// ================================

function renderCart(){

const container=
document.getElementById("cartItems");

const totalElement=
document.getElementById("cartTotal");


container.innerHTML="";


if(cart.length===0){

container.innerHTML=`

<div class="empty-cart">
Səbət boşdur.
</div>

`;

totalElement.textContent=
"Cəmi: 0.00 AZN";

return;

}


let total=0;


cart.forEach(item=>{

total+=Number(item.price);


container.innerHTML+=`

<div class="cart-item">

<span>
${item.name}
</span>

<strong>
${Number(item.price).toFixed(2)}
AZN
</strong>

</div>

`;

});


totalElement.textContent=
"Cəmi: "+total.toFixed(2)+" AZN";

}


// ================================
// PLACE ORDER
// ================================

function placeOrder(){

if(cart.length===0){

alert("Səbət boşdur!");

return;

}


const total=
cart.reduce(
(sum,item)=>
sum+Number(item.price),
0
);


const order={

id:Date.now(),

table:Number(tableNumber),

items:[...cart],

total:total,

aiUsed:aiUsed,

status:"Yeni sifariş"

};


const orders=
JSON.parse(
localStorage.getItem("orders")
) || [];


orders.push(order);


localStorage.setItem(
"orders",
JSON.stringify(orders)
);


alert(
"Sifariş göndərildi! 🍽️"
);


cart=[];

aiUsed=false;

renderCart();

showAIRecommendation();

}


// ================================
// START
// ================================

renderMenu();

renderCart();

</script>

</body>
</html>
