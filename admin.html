<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Bistro</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f5f7;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 22px;
    text-align: center;
}

header h1 {
    margin: 0 0 8px;
}

.table {
    font-size: 15px;
    opacity: 0.9;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.status {
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
    text-align: center;
    font-weight: bold;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.menu-title {
    margin-bottom: 15px;
}

.product {
    background: white;
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.06);
}

.product-name {
    font-weight: bold;
    font-size: 18px;
}

.product-price {
    color: #666;
    margin-top: 5px;
}

button {
    border: none;
    border-radius: 9px;
    padding: 11px 15px;
    cursor: pointer;
    font-weight: bold;
}

.add {
    background: #111827;
    color: white;
}

.cart {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-top: 20px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.06);
}

.cart-item {
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}

.total {
    font-size: 22px;
    font-weight: bold;
    margin-top: 15px;
}

.order-btn {
    width: 100%;
    margin-top: 15px;
    background: #16a34a;
    color: white;
    font-size: 17px;
}

.ai-box {
    display: none;
    background: #f0fdf4;
    border: 1px solid #86efac;
    padding: 18px;
    border-radius: 14px;
    margin-top: 15px;
}

.ai-title {
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 8px;
}

.ai-text {
    color: #166534;
    margin-bottom: 12px;
}

.ai-button {
    background: #16a34a;
    color: white;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #777;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #777;
}
</style>
</head>

<body>

<header>

    <h1>🍽️ AI Bistro</h1>

    <div class="table">
        🪑 Masa №<span id="tableNumber">1</span>
    </div>

</header>


<div class="container">

    <div id="connectionStatus"
         class="status success">
        🔄 Menyu yüklənir...
    </div>


    <h2 class="menu-title">
        📋 Menyu
    </h2>


    <div id="menuList">
        <div class="loading">
            🔄 Menyu yüklənir...
        </div>
    </div>


    <!-- AI RECOMMENDATION -->

    <div id="aiBox" class="ai-box">

        <div class="ai-title">
            🤖 AI tövsiyəsi
        </div>

        <div class="ai-text">
            Burger seçdiniz. Yanına Fries + Cola Combo əlavə etsəniz daha sərfəli olar.
        </div>

        <button
            class="ai-button"
            onclick="addAICombo()"
        >
            🍟🥤 Combo əlavə et — 4.50 AZN
        </button>

    </div>


    <!-- CART -->

    <div class="cart">

        <h2>
            🛒 Sifarişiniz
        </h2>

        <div id="cartList">
            <div class="empty">
                Səbət boşdur.
            </div>
        </div>

        <div class="total">
            Cəmi:
            <span id="total">
                0.00
            </span>
            AZN
        </div>

        <button
            class="order-btn"
            onclick="sendOrder()"
        >
            ✅ Sifarişi göndər
        </button>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://lwxnxcebzhbpjmrboosf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_i2_aVgOrcZNYuwzlUGtK-w_kRhPDgmQ";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   TABLE
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const tableNumber =
    Number(
        params.get("table")
    ) || 1;

document
    .getElementById("tableNumber")
    .textContent =
    tableNumber;


/* =====================================================
   DATA
===================================================== */

let menu = [];

let cart = [];

let aiUsed = false;


/* =====================================================
   LOAD MENU FROM SUPABASE
===================================================== */

async function loadMenu() {

    const menuList =
        document.getElementById(
            "menuList"
        );

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("menu")
                .select("*")
                .eq("active", true)
                .order("id");

        if (error) {
            throw error;
        }

        menu =
            data || [];

        renderMenu();

        document
            .getElementById(
                "connectionStatus"
            )
            .className =
            "status success";

        document
            .getElementById(
                "connectionStatus"
            )
            .textContent =
            "🟢 Menyu hazırdır";

    } catch (error) {

        console.error(error);

        menuList.innerHTML = `
            <div class="empty">
                ❌ Menyu yüklənmədi.
                <br>
                Zəhmət olmasa yenidən cəhd edin.
            </div>
        `;

        document
            .getElementById(
                "connectionStatus"
            )
            .className =
            "status error";

        document
            .getElementById(
                "connectionStatus"
            )
            .textContent =
            "🔴 Menyu bağlantısında problem var";
    }
}


/* =====================================================
   RENDER MENU
===================================================== */

function renderMenu() {

    const container =
        document.getElementById(
            "menuList"
        );

    container.innerHTML = "";

    if (!menu.length) {

        container.innerHTML = `
            <div class="empty">
                Hazırda menyuda məhsul yoxdur.
            </div>
        `;

        return;
    }


    menu.forEach(product => {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "product";


        div.innerHTML = `

            <div>

                <div class="product-name">
                    ${escapeHtml(
                        product.name
                    )}
                </div>

                <div class="product-price">
                    ${Number(
                        product.price
                    ).toFixed(2)}
                    AZN
                </div>

            </div>


            <button
                class="add"
                onclick="addToCart(${product.id})"
            >
                ➕ Əlavə et
            </button>

        `;


        container.appendChild(div);

    });

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(id) {

    const product =
        menu.find(
            p => Number(p.id) === Number(id)
        );

    if (!product) {
        return;
    }


    cart.push({

        id: product.id,

        name: product.name,

        price: Number(
            product.price
        )

    });


    renderCart();

    updateAIRecommendation();
}


/* =====================================================
   AI RECOMMENDATION
===================================================== */

function updateAIRecommendation() {

    const aiBox =
        document.getElementById(
            "aiBox"
        );


    const hasBurger =
        cart.some(item => {

            const name =
                String(
                    item.name
                ).toLowerCase();

            return (
                Number(item.id) === 1 ||
                name.includes("burger")
            );

        });


    const hasCombo =
        cart.some(item =>
            String(
                item.name
            ).toLowerCase()
            .includes("combo")
        );


    const hasFries =
        cart.some(item =>
            String(
                item.name
            ).toLowerCase()
            .includes("fries")
        );


    const hasCola =
        cart.some(item =>
            String(
                item.name
            ).toLowerCase()
            .includes("cola")
        );


    if (
        hasBurger &&
        !hasCombo &&
        !hasFries &&
        !hasCola
    ) {

        aiBox.style.display =
            "block";

    } else {

        aiBox.style.display =
            "none";
    }
}


/* =====================================================
   AI COMBO
===================================================== */

function addAICombo() {

    const alreadyHasCombo =
        cart.some(item =>
            String(
                item.name
            ).toLowerCase()
            .includes("combo")
        );


    if (alreadyHasCombo) {
        return;
    }


    cart.push({

        id: "ai-combo",

        name:
            "🍟 Fries + 🥤 Cola Combo",

        price: 4.50

    });


    aiUsed = true;

    renderCart();

    updateAIRecommendation();

}


/* =====================================================
   CART
===================================================== */

function renderCart() {

    const container =
        document.getElementById(
            "cartList"
        );

    const totalElement =
        document.getElementById(
            "total"
        );


    container.innerHTML = "";


    if (!cart.length) {

        container.innerHTML = `
            <div class="empty">
                Səbət boşdur.
            </div>
        `;

        totalElement.textContent =
            "0.00";

        return;
    }


    let total = 0;


    cart.forEach((item, index) => {

        total +=
            Number(
                item.price
            );


        const div =
            document.createElement(
                "div"
            );

        div.className =
            "cart-item";


        div.innerHTML = `

            ${escapeHtml(
                item.name
            )}

            —
            ${Number(
                item.price
            ).toFixed(2)}
            AZN

            <button
                class="remove"
                onclick="removeFromCart(${index})"
                style="
                    float:right;
                    background:#fee2e2;
                    color:#991b1b;
                    padding:5px 8px;
                "
            >
                ✕
            </button>

        `;


        container.appendChild(div);

    });


    totalElement.textContent =
        total.toFixed(2);
}


/* =====================================================
   REMOVE
===================================================== */

function removeFromCart(index) {

    cart.splice(
        index,
        1
    );

    renderCart();

    updateAIRecommendation();
}


/* =====================================================
   SEND ORDER
===================================================== */

async function sendOrder() {

    if (!cart.length) {

        alert(
            "Səbət boşdur."
        );

        return;
    }


    let total = 0;


    cart.forEach(item => {

        total +=
            Number(
                item.price
            );

    });


    const order = {

        table_number:
            tableNumber,

        items:
            cart,

        total:
            Number(
                total.toFixed(2)
            ),

        ai_used:
            aiUsed,

        status:
            "Yeni sifariş"

    };


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("orders")
                .insert(
                    [order]
                )
                .select();


        if (error) {
            throw error;
        }


        alert(
            "✅ Sifarişiniz mətbəxə göndərildi!"
        );


        cart = [];

        aiUsed = false;

        renderCart();

        updateAIRecommendation();


    } catch (error) {

        console.error(error);

        alert(
            "❌ Sifariş göndərilmədi. Yenidən cəhd edin."
        );
    }
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =====================================================
   START
===================================================== */

loadMenu();

renderCart();

</script>

</body>
</html>
